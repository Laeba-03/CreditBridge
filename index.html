<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CreditBridge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230F1419'/><path d='M9 16h14M16 9v14' stroke='%23fff' stroke-width='3' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --ink-900:#0F1419;--ink-600:#4B5563;--ink-400:#9CA3AF;--line-200:#E5E7EB;
  --surface-0:#FFFFFF;--surface-1:#F9FAFB;--surface-2:#F3F4F6;
  --claude:#7C5CFF;--claude-bg:#EFEBFF;--claude-text:#5B3FE6;
  --action:#2563EB;--action-bg:#DBEAFE;
  --ok:#16A34A;--ok-bg:#DCFCE7;--ok-text:#15803D;
  --warn:#D97706;--warn-bg:#FEF3C7;--warn-text:#B45309;
  --risk:#DC2626;--risk-bg:#FEE2E2;--risk-text:#B91C1C;
  --teal:#0F766E;--teal-bg:#CCFBF1;
  --shadow:0 1px 2px rgba(15,20,25,.06),0 0 0 1px var(--line-200);
  --r-sm:6px;--r-md:10px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --script:"Caveat","Segoe Script","Bradley Hand",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink-900:#F3F4F6;--ink-600:#B8BEC8;--ink-400:#6B7280;--line-200:#2A2F37;
  --surface-0:#171A1F;--surface-1:#0F1115;--surface-2:#1E2228;
  --claude-bg:#2A2452;--claude-text:#B9A6FF;--action-bg:#1E2F55;
  --ok-bg:#153A24;--ok-text:#6EE7A0;--warn-bg:#3D2A0A;--warn-text:#FBBF24;
  --risk-bg:#451A1A;--risk-text:#FCA5A5;--teal-bg:#0F3330;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px var(--line-200);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--surface-1);color:var(--ink-900);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface-0)}
.num{font-variant-numeric:tabular-nums lining-nums}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- chrome ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface-0);border-bottom:1px solid var(--line-200);height:52px;display:flex;align-items:center;gap:28px;padding:0 24px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;text-decoration:none;font-size:15px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--ink-900);display:inline-grid;place-items:center}
.brand i::before{content:"";width:10px;height:10px;border:2.5px solid var(--surface-0);border-radius:2px}
.nav a{text-decoration:none;color:var(--ink-600);padding:6px 10px;border-radius:var(--r-sm);font-weight:500}
.nav a.on{color:var(--ink-900);background:var(--surface-2)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-200);border-radius:999px;padding:5px 11px 5px 9px;background:var(--surface-0);font-weight:500;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-400);flex:none}
.dot.ok{background:var(--ok)}.dot.risk{background:var(--risk)}.dot.claude{background:var(--claude)}
.dot.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(124,92,255,.5)}60%{box-shadow:0 0 0 6px rgba(124,92,255,0)}}
.wrap{max-width:1120px;margin:0 auto;padding:28px 24px 80px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
h2{font-size:15px;font-weight:600;margin:0}
.muted{color:var(--ink-600)}.faint{color:var(--ink-400)}
.card{background:var(--surface-0);border-radius:var(--r-md);box-shadow:var(--shadow);padding:20px}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-200);background:var(--surface-0);border-radius:var(--r-sm);padding:7px 13px;font-weight:500;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--action);border-color:var(--action);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.dark{background:var(--ink-900);border-color:var(--ink-900);color:var(--surface-0)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.chip.claude{background:var(--claude-bg);color:var(--claude-text)}
.chip.edited{background:var(--warn-bg);color:var(--warn-text)}
.chip.confirmed{background:var(--ok-bg);color:var(--ok-text)}
.chip.neutral{background:var(--surface-2);color:var(--ink-600)}
.tier{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-weight:700;font-size:13px;color:#fff}
.tier.A{background:#15803D}.tier.B{background:var(--teal)}.tier.C{background:#B45309}.tier.D{background:#B91C1C}

/* ---------- deals table ---------- */
.filters{display:flex;gap:6px;margin:14px 0 12px}
.filters button{border:1px solid var(--line-200);background:var(--surface-0);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:500}
.filters button.on{background:var(--ink-900);color:var(--surface-0);border-color:var(--ink-900)}
table.deals{width:100%;border-collapse:collapse;background:var(--surface-0);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
table.deals th{text-align:left;font-weight:500;color:var(--ink-600);font-size:12px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line-200)}
table.deals td{padding:0 14px;height:40px;border-bottom:1px solid var(--line-200);white-space:nowrap}
table.deals tr:last-child td{border-bottom:0}
table.deals tbody tr{cursor:pointer}
table.deals tbody tr:hover td{background:var(--surface-2)}
.tscroll{overflow-x:auto}
.status{display:inline-flex;align-items:center;gap:7px;font-weight:500}
.empty{text-align:center;padding:64px 24px}
.empty .mark{color:var(--claude);font-size:28px;margin-bottom:8px}

/* ---------- deal page ---------- */
.back{text-decoration:none;color:var(--ink-600);font-weight:500}
.stepper{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;flex:1}
.step{height:38px;border-radius:var(--r-sm);display:flex;align-items:center;gap:9px;padding:0 12px;font-size:12.5px;font-weight:600;color:var(--ink-400);background:var(--surface-2);overflow:hidden;position:relative}
.step span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .fill{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);transition:transform .3s ease}
.step.on .fill{transform:scaleX(1)}
.step>*{position:relative}
.step.draft.on{color:var(--claude-text)}.step.draft .fill{background:var(--claude-bg)}
.step.live.on{color:#fff}.step.live .fill{background:var(--action)}
.step.signed.on{color:#fff}.step.signed .fill{background:var(--ok)}
.step.done{color:var(--ink-600)}.step.done .fill{background:var(--surface-2)}
.glance{display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:0}
.glance>div{padding:16px 20px;border-right:1px solid var(--line-200)}
.glance>div:last-child{border-right:0}
.glance .l{font-size:12px;color:var(--ink-600);margin-bottom:4px}
.glance .v{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.glance .q{font-size:12px;color:var(--ink-600);margin-top:5px;display:flex;align-items:center;gap:6px}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.spark i{width:4px;background:var(--ink-400);border-radius:1px;display:block}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.bars{display:grid;grid-template-columns:120px 1fr 150px;gap:8px 14px;align-items:center}
.bars .lbl{font-size:13px;color:var(--ink-600);display:flex;align-items:center;gap:6px}
.bar{height:22px;border-radius:4px;position:relative;background:transparent}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .12s ease}
.bar.req>i{border:1.5px solid var(--line-200);background:transparent}
.bar.cl>i{background:var(--claude)}
.bar.ap>i{background:var(--ink-900)}
.bars .val{font-weight:600;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.axis{grid-column:2;display:flex;justify-content:space-between;font-size:11px;color:var(--ink-400);margin-top:-2px}
.delta{font-size:12px;color:var(--ink-600);margin:8px 0 0;grid-column:2/4}
.field{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--r-sm);padding:3px 6px;margin:-4px -6px;cursor:text;min-width:60px}
.field:hover{border-color:var(--line-200);background:var(--surface-2)}
.field input{border:0;background:transparent;width:100%;padding:0;font-weight:600;text-align:right}
.field input:focus{outline:none}
.field.editing{border-color:var(--action);background:var(--surface-0);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.prov{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line-200);border-radius:var(--r-md);margin-top:22px;overflow:hidden}
.prov>div{padding:12px 16px 12px 14px;border-right:1px solid var(--line-200);border-left:2px solid var(--claude)}
.prov>div:last-child{border-right:0}
.prov>div.edited{border-left-color:var(--warn)}.prov>div.confirmed{border-left-color:var(--ok)}
.prov .l{font-size:12px;color:var(--ink-600)}
.prov .v{font-size:16px;font-weight:600;margin:4px 0}
.prov .old{font-size:12px;color:var(--ink-400);text-decoration:line-through}
.cov{margin-top:22px}
.cov ul{list-style:none;padding:0;margin:8px 0 0}
.cov li{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 10px;border:1px solid var(--line-200);border-left:2px solid var(--claude);border-radius:var(--r-sm);margin-bottom:6px}
.cov li.edited{border-left-color:var(--warn)}.cov li.confirmed{border-left-color:var(--ok)}
.cov li.off{opacity:.55}
.cov input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink-900)}
.cov .t{flex:1}
.cov .note{font-size:12px;color:var(--ink-600);margin-top:2px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-200)}
.evidence ul{list-style:none;margin:0;padding:0}
.evidence li{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line-200)}
.evidence li:last-child{border:0}
.evidence .src{color:var(--ink-400);font-size:12px;white-space:nowrap;text-decoration:underline dotted;cursor:help}
.flag{display:flex;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--warn-bg);color:var(--warn-text);font-size:13px;margin-top:12px}
.banner{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:var(--r-md);background:var(--risk-bg);color:var(--risk-text);font-weight:500;margin-bottom:14px}
.locked{pointer-events:none;opacity:.7}
.tip{position:relative}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink-900);color:var(--surface-0);padding:9px 14px;border-radius:var(--r-sm);font-weight:500;opacity:0;transition:.2s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,20,25,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--surface-0);border-radius:12px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-200);font-weight:600;font-size:15px}
.modal .body{padding:20px}
.modal .x{border:0;background:transparent;font-size:18px;color:var(--ink-600);padding:4px 8px;border-radius:6px}
.stepn{font-weight:600;margin-bottom:8px}
.urlbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line-200);border-radius:var(--r-sm);padding:4px 4px 4px 12px;background:var(--surface-2)}
.urlbox input{flex:1;border:0;background:transparent;font:13px var(--mono);min-width:0}
.urlbox input:focus{outline:none}
.help{color:var(--ink-600);font-size:13px;margin:10px 0 12px}
.divider{height:1px;background:var(--line-200);margin:18px 0}
.listen{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:var(--r-sm);background:var(--surface-2)}
.spin{width:14px;height:14px;border:2px solid var(--line-200);border-top-color:var(--ink-600);border-radius:50%;animation:spin 1s linear infinite;margin-top:3px;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.okdot{width:12px;height:12px;border-radius:50%;background:var(--ok);margin-top:4px;flex:none;animation:spring .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes spring{from{transform:scale(0)}to{transform:scale(1)}}
details.cfg summary{cursor:pointer;color:var(--ink-600);font-size:13px;margin-top:10px}
details.cfg pre{font:12px var(--mono);background:var(--surface-2);padding:10px;border-radius:var(--r-sm);overflow-x:auto;margin:8px 0 0}
.modal.small{width:min(440px,100%)}
textarea{width:100%;border:1px solid var(--line-200);border-radius:var(--r-sm);padding:9px 11px;font:inherit;background:var(--surface-0);color:inherit;resize:vertical;min-height:72px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line-200)}

/* ---------- audit ---------- */
.audit{list-style:none;padding:0;margin:0}
.audit li{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--line-200)}
.audit time{color:var(--ink-400);font-size:12px;font-family:var(--mono)}

/* ---------- offer page ---------- */
.offer{max-width:640px;margin:0 auto;padding:36px 20px 80px;font-size:16px}
.offer .lender{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo i{width:26px;height:26px;border-radius:50%;background:var(--ink-900);display:inline-block}
.expires{text-align:right;font-size:13px;color:var(--ink-600)}
.expires b{display:block;color:var(--ink-900);font-size:14px}
.offer h1{font-size:28px;line-height:1.2;letter-spacing:-.015em;margin:0 0 6px}
.offer .by{color:var(--ink-600);margin-bottom:28px}
.hero{background:var(--ink-900);color:#F9FAFB;border-radius:14px;padding:26px 28px;margin-bottom:32px}
.hero .l{font-size:13px;opacity:.7}
.hero .big{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:4px 0 8px}
.hero .t{font-size:14px;opacity:.85}
.offer h2{font-size:17px;margin:0 0 12px}
.ocard{background:var(--surface-0);border-radius:12px;box-shadow:var(--shadow);padding:24px;margin-bottom:32px}
.drawamt{font-size:34px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:baseline;gap:4px}
.drawamt input{border:0;border-bottom:2px solid var(--line-200);background:transparent;font:inherit;width:100%;max-width:280px;padding:0 0 2px}
.drawamt input:focus{outline:none;border-color:var(--action)}
input[type=range]{width:100%;margin:18px 0 6px;accent-color:var(--ink-900)}
.rngl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-400)}
.quick{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.quick button{border:1px solid var(--line-200);background:var(--surface-0);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.quick button.on{background:var(--ink-900);color:var(--surface-0);border-color:var(--ink-900)}
.hint{font-size:13px;color:var(--ink-600);margin-top:12px}
.repay{display:grid;gap:0}
.repay>div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-200)}
.repay>div:last-of-type{border-bottom:0}
.repay b{font-weight:600}
.repay .k{color:var(--ink-600)}
details.amort summary{cursor:pointer;color:var(--ink-600);font-size:14px;margin-top:12px}
details.amort table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
details.amort td,details.amort th{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line-200)}
details.amort th{color:var(--ink-600);font-weight:500}
details.amort td:first-child,details.amort th:first-child{text-align:left}
.conds ul{margin:0;padding-left:20px}
.conds li{margin-bottom:6px}
.conds .info{display:flex;gap:8px;font-size:14px;color:var(--ink-600);margin-top:10px}
.sign label{display:block;font-size:13px;color:var(--ink-600);margin:14px 0 5px}
.sign input[type=text]{width:100%;border:1px solid var(--line-200);border-radius:8px;padding:10px 12px;background:var(--surface-0)}
.sign input[type=text]:focus{outline:none;border-color:var(--action);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.agree{display:flex;gap:10px;align-items:flex-start;margin:18px 0 4px;font-size:14px}
.agree input{width:18px;height:18px;margin-top:2px;accent-color:var(--ink-900)}
.agree a{color:var(--action)}
.sigline{display:flex;align-items:center;gap:12px}
.sigline .rendered{font:600 30px var(--script);color:var(--ink-900);min-width:120px;border-bottom:1px solid var(--line-200);padding:0 6px 2px;min-height:40px;transition:opacity .2s}
.btn.accept{width:100%;justify-content:center;padding:13px;font-size:16px;margin-top:18px;border-radius:9px}
.legal{font-size:13px;color:var(--ink-600);margin-top:10px}
.ofoot{text-align:center;font-size:13px;color:var(--ink-600);margin-top:36px}
.done{text-align:center;padding:60px 0}
.done .check{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok-text);display:inline-grid;place-items:center;font-size:26px;margin-bottom:16px;animation:spring .35s cubic-bezier(.34,1.56,.64,1)}
.done h1{margin-bottom:6px}
.expired{padding:60px 0;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(15,20,25,.45);z-index:40;display:flex;justify-content:flex-end}
.sheet .pane{width:min(520px,100%);background:var(--surface-0);height:100%;overflow:auto;padding:24px}
.sheet .pane h3{margin:0 0 12px}
.sheet .pane p{font-size:14px;color:var(--ink-600)}

@media (max-width:820px){
  .glance{grid-template-columns:repeat(2,1fr)}.glance>div{border-bottom:1px solid var(--line-200)}
  .prov{grid-template-columns:repeat(2,1fr)}
  .bars{grid-template-columns:90px 1fr 120px}
  .stepper{grid-template-columns:1fr}
  .topbar{gap:12px;padding:0 14px}.wrap{padding:20px 14px 80px}
  .audit li{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>

<script>
/* =========================================================
   Data & state — the server (SQLite) is the source of truth
   ========================================================= */
let S = { workspace:{name:"CreditBridge",officer:"",officerEmail:""}, claude:{linked:false}, deals:[], audit:[] };
async function api(path, opts){
  const r = await fetch(path, { headers:{"Content-Type":"application/json"}, ...opts });
  if(!r.ok){ let m=r.statusText; try{ m=(await r.json()).detail||m; }catch(e){} throw new Error(m); }
  return r.status===204 ? null : r.json();
}
async function load(){
  const h = location.hash.replace(/^#\/?/,""); const [p,id]=h.split("/");
  if(p==="offer" && id){
    const o = await api("/api/offer/"+id);
    S = { workspace:o.workspace, claude:{linked:false}, deals:o.deal?[o.deal]:[], audit:[] };
  } else {
    S = await api("/api/state");
  }
}
// Persist one deal after the officer changes it.
function save(d){ if(!d) return; api("/api/deals/"+d.id,{method:"PUT",body:JSON.stringify(d)}).catch(e=>toast("Save failed: "+e.message)); }
function revokeClaude(){ return api("/api/claude/revoke",{method:"POST"}).then(load); }

/* =========================================================
   Formatting helpers (en-IN)
   ========================================================= */
const inr = new Intl.NumberFormat("en-IN",{ style:"currency", currency:"INR", maximumFractionDigits:0 });
const fmt = n => inr.format(Math.round(n));
function abbr(n){
  if(n>=1e7) return "₹"+(n/1e7).toFixed(n%1e7?2:0).replace(/\.?0+$/,"")+" Cr";
  if(n>=1e5) return "₹"+(n/1e5).toFixed(n%1e5?1:0).replace(/\.0$/,"")+" L";
  return fmt(n);
}
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function now(){ const d=new Date(); return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2200); }
function spark(a,cls){ const m=Math.max(...a); return `<span class="spark ${cls||""}">${a.map(v=>`<i style="height:${Math.max(2,Math.round(v/m*14))}px"></i>`).join("")}</span>`; }
const PROV = { claude:'<span class="chip claude">✦ Claude</span>', edited:'<span class="chip edited">✎ Edited</span>', confirmed:'<span class="chip confirmed">✓ Confirmed</span>' };
function provChip(f){ if(f.prov==="claude") return PROV.claude; return `<span class="chip ${f.prov}">${f.prov==="edited"?"✎":"✓"} ${esc(f.by||"")} · ${esc(f.at||"")}</span>`; }
const byId = id => S.deals.find(d=>d.id===id);
function unreviewed(d){ return Object.values(d.fields).filter(f=>f.prov==="claude").length + d.covenants.filter(c=>c.prov==="claude").length; }
function audit(what,who){ S.audit.unshift({ at:now(), who:who||S.workspace.officer, what }); api("/api/audit",{method:"POST",body:JSON.stringify({what,who})}).catch(()=>{}); }

/* =========================================================
   Routing
   ========================================================= */
window.addEventListener("hashchange", ()=>load().then(route).catch(()=>route()));
function route(){
  const h = location.hash.replace(/^#\/?/,"") || "deals";
  const [p,id] = h.split("/");
  const app = document.getElementById("app");
  if(p==="offer" && id){ document.title="Your credit offer · "+S.workspace.name; app.innerHTML = renderOffer(id); bindOffer(id); window.scrollTo(0,0); return; }
  document.title="CreditBridge";
  let body;
  if(p==="deals" && id) body = renderDeal(id);
  else if(p==="audit") body = renderAudit();
  else body = renderDeals();
  app.innerHTML = renderChrome(p, body);
  bindChrome(); if(p==="deals" && id) bindDeal(id);
  window.scrollTo(0,0);
}

      ${x.prov==="edited"?`<div class="old num">${x.claude}${unit}</div>`:""}${provChip(x)}</div>`; };

  <div class="card glance" style="margin-bottom:16px">
    <div><div class="l">Monthly revenue</div><div class="v num">${abbr(g.revenue)}</div><div class="q">${spark(g.spark)} ${esc(g.revQoQ)}</div></div>
    <div><div class="l">DSCR</div><div class="v num">${g.dscr.toFixed(1)}×</div><div class="q">${g.dscr>=1.5?'<span style="color:var(--ok-text)">✓ above 1.5×</span>':'<span style="color:var(--warn-text)">below 1.5×</span>'}</div></div>
    <div><div class="l">Cash volatility</div><div class="v num">${g.vol}%</div><div class="q">${spark(g.volSpark)} ${g.vol<20?"Low":g.vol<35?"Moderate":"High"}</div></div>
    <div><div class="l">Risk tier</div><div class="v"><span class="tier ${g.tier}" style="width:30px;height:30px;font-size:16px">${g.tier}</span></div><div class="q">${PROV.claude}</div></div>
    <div><div class="l">Confidence</div><div class="v" style="font-size:18px"><span class="dot ${g.confidence==='High'?'ok':''}" style="display:inline-block;margin-right:6px;${g.confidence==='Medium'?'background:var(--warn)':''}"></span>${g.confidence}</div><div class="q"><a href="#flags" style="color:inherit">${g.flags} flag${g.flags===1?"":"s"} ▾</a></div></div>

    <div class="${locked?'locked':''}">

      <div class="lbl">Requested</div><div class="bar req"><i style="width:100%"></i></div><div class="val num muted">${fmt(d.requested)}</div>

      <div></div><div class="axis num"><span>₹0</span><span>${abbr(f.limit.claude)}</span><span>${abbr(d.requested)}</span></div><div></div>

        <div class="t"><div>${esc(c.text)}</div>${c.breach?`<div class="note">breach → ${esc(c.breach)}</div>`:""}</div>
        ${c.prov==="claude"?PROV.claude:c.prov==="edited"?'<span class="chip edited">✎ Edited</span>':'<span class="chip confirmed">✓ Confirmed</span>'}
      </li>`).join("")}</ul>
    </div>
    </div>
    <div class="foot">
      <button class="btn" id="confirmAll" ${n===0||locked?"disabled":""}>Confirm all Claude values <span class="faint" style="font-family:var(--mono);font-size:11px">⌘⏎</span></button>
      <span class="${n?'':'muted'}" style="font-weight:500;color:${n?'var(--claude-text)':''}">${n?`${n} of ${Object.keys(f).length+d.covenants.length} fields still ✦ unreviewed`:'All fields reviewed by a human'}</span>
    </div>

  <div class="card evidence" id="flags">
    <div class="section-title"><h2>Evidence <span class="muted" style="font-weight:400">from Claude</span></h2><button class="btn sm" id="viewSrc">View source statements ▸</button></div>
    <ul>${d.evidence.map(e=>`<li><span>${esc(e.t)}</span><span class="src" title="Opens the cited page">${esc(e.src)}</span></li>`).join("")}</ul>

function bindDeal(id){
  const d=byId(id); if(!d) return;
  const locked = d.status==="signed";
  const parse = s => Number(String(s).replace(/[^\d.]/g,""))||0;

  // inline editable fields
  document.querySelectorAll(".field").forEach(el=>{
    const inp=el.querySelector("input"); const key=el.dataset.field;
    if(locked) return;
    el.onclick=()=>{ inp.focus(); inp.select(); };
    inp.onfocus=()=>el.classList.add("editing");
    inp.onkeydown=e=>{ if(e.key==="Enter"){inp.blur();} if(e.key==="Escape"){ inp.value=key==="limit"?fmt(d.fields[key].value):d.fields[key].value; inp.blur(); } };
    inp.oninput=()=>{ if(key==="limit"){ const v=parse(inp.value); const ap=document.getElementById("apBar"); if(ap) ap.style.width=Math.min(100,v/d.requested*100)+"%"; } };
    inp.onblur=()=>{ el.classList.remove("editing"); commit(key, parse(inp.value)); };
  });
  async function commit(key, v){
    const f=d.fields[key];
    if(key==="limit" && v<=0){ route(); return; }
    if(v===f.value){ route(); return; }
    const big = f.claude && Math.abs(v-f.claude)/f.claude>0.10;
    let note=f.note;
    if(big){ note = await askReason(`Override is ${(Math.abs(v-f.claude)/f.claude*100).toFixed(0)}% from Claude's ${key==="limit"?fmt(f.claude):f.claude}. Add a reason for the audit log.`); if(note===null){ route(); return; } }
    const old=f.value; f.value=v; f.prov = v===f.claude ? "confirmed" : "edited"; f.by=S.workspace.officer; f.at=now(); if(note) f.note=note;
    audit(`Edited ${key==="limit"?"credit limit":key.toUpperCase()==="APR"?"APR":key} on ${d.borrower}: ${key==="limit"?fmt(old)+" → "+fmt(v):old+" → "+v}${note?` · “${note}”`:""}`);
    save(d); route(); toast("Saved");
  }
  document.querySelectorAll("input[data-cov]").forEach(cb=>cb.onchange=async()=>{
    const c=d.covenants.find(x=>x.id===cb.dataset.cov);
    if(c.prov==="claude" && c.on && !cb.checked){ const r=await askReason("You're removing a covenant Claude recommended. Add a reason."); if(r===null){ route(); return; } c.note=r; }
    c.on=cb.checked; c.prov="edited"; audit(`${cb.checked?"Enabled":"Removed"} covenant “${c.text}” on ${d.borrower}${c.note?` · “${c.note}”`:""}`); save(d); route();
  });
  const confirmAll=document.getElementById("confirmAll");
  const doConfirm=()=>{ let k=0; Object.values(d.fields).forEach(f=>{ if(f.prov==="claude"){f.prov="confirmed";f.by=S.workspace.officer;f.at=now();k++;} }); d.covenants.forEach(c=>{ if(c.prov==="claude"){c.prov="confirmed";k++;} }); audit(`Confirmed all Claude values on ${d.borrower} (${k} fields)`); save(d); route(); toast("Confirmed"); };
  if(confirmAll) confirmAll.onclick=doConfirm;
  document.onkeydown=e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter"&&unreviewed(d)&&!locked){ e.preventDefault(); doConfirm(); } };
  const pub=document.getElementById("publishBtn");
  if(pub) pub.onclick=()=>{ d.status="live"; d.offer.published=true; d.offer.publishedAt=now(); d.offer.expires=Date.now()+7*864e5; d.offer.views=0; d.offer.lastView="—"; audit(`Published offer for ${d.borrower}`); save(d); route(); toast("Published"); };
  const cl=document.getElementById("copyLink"); if(cl) cl.onclick=()=>{ const u=location.href.split("#")[0]+"#/offer/"+d.id; navigator.clipboard?.writeText(u); cl.textContent="Copied ✓"; setTimeout(()=>cl.textContent="Copy link",2000); };
  const un=document.getElementById("unpublish"); if(un) un.onclick=()=>{ if(!confirm("Unpublish this offer? The borrower link will stop working.")) return; d.status="draft"; d.offer.published=false; audit(`Unpublished offer for ${d.borrower}`); save(d); route(); toast("Unpublished"); };
  const am=document.getElementById("amend"); if(am) am.onclick=()=>toast("Amendments create a new facility version (not in demo)");
  const dl=document.getElementById("dlPdf"); if(dl) dl.onclick=()=>toast("Executed facility PDF is generated server-side (not in demo)");
  const vs=document.getElementById("viewSrc"); if(vs) vs.onclick=()=>toast("Source statements open in a side drawer (not in demo)");
  const ac=document.getElementById("addCov"); if(ac) ac.onclick=async()=>{ if(locked) return; const t=await askReason("Covenant text (as the officer writes it)","e.g. Min. closing balance ≥ ₹5 L"); if(!t) return; d.covenants.push({id:"c"+Date.now(),on:true,prov:"edited",text:t,borrower:t,breach:"draw freeze"}); audit(`Added covenant “${t}” on ${d.borrower}`); save(d); route(); };
}

function askReason(msg, ph){
  return new Promise(res=>{
    const root=document.getElementById("modalRoot");
    root.innerHTML=`<div class="scrim"><div class="modal small"><header>Reason required<button class="x" id="mx">✕</button></header><div class="body"><p class="muted" style="margin:0 0 10px">${esc(msg)}</p><textarea id="reason" placeholder="${esc(ph||'At least 12 characters')}"></textarea></div><footer><button class="btn" id="mc">Cancel</button><button class="btn primary" id="mo" disabled>Save</button></footer></div></div>`;
    const ta=root.querySelector("#reason"), ok=root.querySelector("#mo");
    ta.focus(); ta.oninput=()=>ok.disabled=ta.value.trim().length<(ph?3:12);
    const close=v=>{ root.innerHTML=""; res(v); };
    root.querySelector("#mx").onclick=()=>close(null); root.querySelector("#mc").onclick=()=>close(null); ok.onclick=()=>close(ta.value.trim());
  });
}

      <div class="stepn">2 · We're listening</div>
      <div class="listen" id="listen">${linked
        ? `<span class="okdot"></span><div><b>Claude is linked</b><div class="muted" style="font-size:13px">Connected from ${esc(S.claude.client)} · ${esc(S.workspace.officerEmail)}<br>Tools exposed: <span style="font-family:var(--mono);font-size:12px">upload_deal · list_deals · get_deal</span></div></div>`
        : `<span class="spin"></span><div class="muted">Waiting for Claude to say hello…</div>`}</div>
      <div class="faint" style="font-size:12px;margin-top:12px">This link is tied to your workspace and can be revoked anytime.${linked?` <a href="#" id="revoke">Revoke</a>`:""}</div>
    </div>
    <footer>${linked?`<button class="btn primary" id="mdone">Done — go to deals ▸</button>`:`<button class="btn" id="mc">Close</button>`}</footer>
  </div></div>`;
  const close=()=>{ root.innerHTML=""; clearInterval(root._t); };
  root.querySelector("#mx").onclick=close; const mc=root.querySelector("#mc"); if(mc) mc.onclick=close;
  const md=root.querySelector("#mdone"); if(md) md.onclick=()=>{ close(); location.hash="#/deals"; route(); };
  const rv=root.querySelector("#revoke"); if(rv) rv.onclick=e=>{ e.preventDefault(); revokeClaude().then(()=>{ close(); route(); }); };
  root.querySelector("#scrim").onclick=e=>{ if(e.target.id==="scrim") close(); };
  const inp=root.querySelector("#mcpUrl"); inp.focus(); inp.select();
  const cp=root.querySelector("#copyUrl");
  cp.onclick=()=>{
    navigator.clipboard?.writeText(url); inp.select();
    cp.textContent="Copied ✓"; setTimeout(()=>cp.textContent="Copy",2000);
  };
  // Poll until the real MCP initialize handshake lands.
  if(!linked){ root._t=setInterval(async()=>{ try{ await load(); }catch(e){ return; } if(S.claude.linked){ clearInterval(root._t); close(); route(); toast("Claude linked"); } },2500); }
}

/* ---------- Audit log ---------- */
function renderAudit(){
  return `<h1>Audit log</h1><div class="muted" style="margin-bottom:14px">Every change to a decision field, publish and signature. Original Claude values are never deleted.</div>
  <div class="card"><ul class="audit">${S.audit.map(a=>`<li><time>${esc(a.at)}</time><div><b>${esc(a.who)}</b> · ${esc(a.what)}</div></li>`).join("")}</ul></div>`;
}

/* =========================================================
   Borrower offer page
   ========================================================= */
function calc(P, apr, months){
  const n=Math.round(months*52/12), i=apr/100/52;
  const pay = i? P*i/(1-Math.pow(1+i,-n)) : P/n;
  return { n, pay, total:pay*n, interest:pay*n-P, i };
}
function countdown(ts){ const ms=ts-Date.now(); if(ms<=0) return null; const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5); return `${d} day${d===1?"":"s"} · ${h}h`; }
function firstPay(){ const d=new Date(); d.setDate(d.getDate()+((5-d.getDay()+7)%7||7)+7); return d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"}); }
function fundDate(){ const d=new Date(); d.setDate(d.getDate()+((1-d.getDay()+7)%7||7)); return d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"}); }

function renderOffer(id){
  const d=byId(id);
  const lender=`<div class="lender"><div class="logo"><i></i>${esc(S.workspace.name)}</div>`;
  if(!d || !d.offer.published) return `<div class="offer">${lender}</div><div class="expired"><h1>This offer isn't available.</h1><p class="muted">The link may have been withdrawn. Contact ${esc(S.workspace.officer)} at ${esc(S.workspace.officerEmail)}.</p></div><div class="ofoot">🔒 Secured by CreditBridge</div></div>`;
  const o=d.offer, f=d.fields;
  if(o.signed) return `<div class="offer">${lender}</div>${renderDone(d)}</div>`;
  const cd=countdown(o.expires);
  if(!cd) return `<div class="offer">${lender}</div><div class="expired"><h1>This offer expired.</h1><p class="muted">Contact ${esc(S.workspace.officer)} to request a refreshed offer.</p></div></div>`;
  const limit=f.limit.value, start=Math.min(limit, Math.round(limit*0.55/50000)*50000);
  const borrowerShort=d.borrower.replace(/ (Pvt Ltd|LLP|Ltd)$/,"");
  return `<div class="offer">
    ${lender}<div class="expires">Offer expires in<b class="num">${cd}</b></div></div>
    <h1>${esc(borrowerShort)}, you're approved.</h1>
    <div class="by">A revolving credit line prepared by ${esc(S.workspace.officer)}, Credit Officer.</div>
    <div class="hero"><div class="l">Approved credit line</div><div class="big num">${fmt(limit)}</div><div class="t num">${f.apr.value}% APR · ${f.term.value}-month term · draw anytime for ${f.draw.value} months</div></div>

    <h2>How much would you like to draw today?</h2>
    <div class="ocard">
      <div class="drawamt num">₹<input id="drawIn" inputmode="numeric" value="${new Intl.NumberFormat('en-IN').format(start)}"></div>
      <input type="range" id="drawRange" min="0" max="${limit}" step="50000" value="${start}" aria-label="Draw amount">
      <div class="rngl num"><span>₹0</span><span>${fmt(limit)} max</span></div>
      <div class="quick" id="quick">${[0.2,0.5,0.75,1].map(p=>{const v=Math.round(limit*p/50000)*50000; return `<button data-v="${v}">${p===1?"Full ":""}${abbr(v)}</button>`;}).join("")}</div>
      <div class="hint" id="hint"></div>
    </div>

    <h2>What you'll repay</h2>
    <div class="ocard">
      <div class="repay num">
        <div><span class="k">Weekly payment</span><b id="rPay"></b></div>
        <div><span class="k">Total interest</span><b id="rInt"></b></div>
        <div><span class="k">Total repaid</span><b id="rTot"></b></div>
        <div><span class="k">First payment</span><b>${firstPay()} · NACH debit</b></div>
        <div><span class="k">Pay off early</span><b>No fee</b></div>
      </div>
      <details class="amort"><summary>View amortization schedule</summary><div class="tscroll" id="amort"></div></details>
    </div>

    <h2>Conditions of this line</h2>
    <div class="ocard conds">
      <ul>${d.covenants.filter(c=>c.on).map(c=>`<li>${esc(c.borrower)}</li>`).join("")||"<li>No ongoing conditions.</li>"}</ul>
      <div class="info">ⓘ <span>If a condition is breached, new draws pause; the terms on your existing balance don't change.</span></div>
    </div>

    <h2>Accept this facility</h2>
    <div class="ocard sign">
      <label for="sName">Full legal name</label><input type="text" id="sName" autocomplete="name">
      <label for="sTitle">Title</label><input type="text" id="sTitle" placeholder="Director">
      <div class="agree"><input type="checkbox" id="agree"><label for="agree" style="margin:0;color:inherit;font-size:14px">I've read the <a href="#" id="openAgr">Credit Facility Agreement</a> (14 pages, e-stamped) and agree to it on behalf of ${esc(d.borrower)}</label></div>
      <label for="sSig">Type your name to sign</label>
      <div class="sigline"><input type="text" id="sSig" autocomplete="off" style="flex:1"><div class="rendered" id="sigR" aria-hidden="true"></div></div>
      <button class="btn dark accept" id="acceptBtn" disabled>Accept <span class="num" id="acceptAmt"></span> draw &amp; sign facility</button>
      <div class="legal">By signing you agree to the terms above. We'll record the time, your IP address and a copy of this page.</div>
    </div>
    <div class="ofoot">Questions? Reply to ${esc(S.workspace.officerEmail)}<br>🔒 Secured by CreditBridge · Electronic signature under IT Act 2000 · Aadhaar eSign available</div>
  </div>`;
}
function renderDone(d){
  const o=d.offer, f=d.fields, c=calc(o.draw||0,f.apr.value,f.term.value);
  return `<div class="done"><div class="check">✓</div><h1>Signed. Funds arrive ${fundDate()}.</h1>
  <p class="muted num">${fmt(o.draw||0)} to account ••••4821 (HDFC) · Weekly ${fmt(c.pay)} starting ${firstPay()}</p>
  <p class="faint" style="font-size:13px">Signed by ${esc(o.signer||"")} · ${esc(o.signed||"")}</p>
  <div class="row" style="justify-content:center;gap:8px;margin-top:18px;flex-wrap:wrap"><button class="btn dark" onclick="toast('PDF is generated server-side (not in demo)')">Download signed agreement</button><button class="btn" onclick="toast('Calendar file (not in demo)')">Add payment dates to calendar</button></div></div>
  <div class="ofoot">🔒 Secured by CreditBridge</div>`;
}
function bindOffer(id){
  const d=byId(id); if(!d||!d.offer.published||d.offer.signed) return;
  const f=d.fields, limit=f.limit.value;
  const rng=document.getElementById("drawRange"), inp=document.getElementById("drawIn"); if(!rng) return;
  const nf=new Intl.NumberFormat("en-IN");
  let shown={pay:0,int:0,tot:0};
  function tween(el,from,to){ const t0=performance.now(); const step=t=>{ const k=Math.min(1,(t-t0)/150); el.textContent=fmt(from+(to-from)*k); if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
  function update(v, src){
    v=Math.max(0,Math.min(limit, Math.round(v/50000)*50000));
    if(src!=="range") rng.value=v; if(src!=="input") inp.value=nf.format(v);
    const c=calc(v,f.apr.value,f.term.value);
    tween(document.getElementById("rPay"),shown.pay,c.pay); tween(document.getElementById("rInt"),shown.int,c.interest); tween(document.getElementById("rTot"),shown.tot,c.total);
    shown={pay:c.pay,int:c.interest,tot:c.total};
    document.getElementById("acceptAmt").textContent=fmt(v);
    document.querySelectorAll("#quick button").forEach(b=>b.classList.toggle("on",Number(b.dataset.v)===v));
    document.getElementById("hint").textContent = v<500000 ? "Many borrowers draw a smaller amount first and draw more later — there's no fee to draw again." : "";
    let bal=v, rows=""; for(let k=1;k<=c.n;k++){ const int=bal*c.i, pr=c.pay-int; bal=Math.max(0,bal-pr); if(k<=6||k>c.n-2||k%13===0) rows+=`<tr><td>Week ${k}</td><td>${fmt(c.pay)}</td><td>${fmt(int)}</td><td>${fmt(pr)}</td><td>${fmt(bal)}</td></tr>`; else if(k===7) rows+=`<tr><td colspan="5" style="text-align:center;color:var(--ink-400)">…</td></tr>`; }
    document.getElementById("amort").innerHTML=`<table><thead><tr><th>Payment</th><th>Amount</th><th>Interest</th><th>Principal</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table>`;
    gate();
  }
  rng.oninput=()=>update(Number(rng.value),"range");
  inp.oninput=()=>{ const v=Number(inp.value.replace(/[^\d]/g,""))||0; rng.value=Math.min(limit,v); const c=calc(Math.min(limit,v),f.apr.value,f.term.value); document.getElementById("acceptAmt").textContent=fmt(Math.min(limit,v)); };
  inp.onblur=()=>update(Number(inp.value.replace(/[^\d]/g,""))||0,"blur");
  inp.onkeydown=e=>{ if(e.key==="Enter") inp.blur(); };
  document.getElementById("quick").onclick=e=>{ const b=e.target.closest("button"); if(b) update(Number(b.dataset.v)); };
  const name=document.getElementById("sName"), sig=document.getElementById("sSig"), agree=document.getElementById("agree"), btn=document.getElementById("acceptBtn"), sigR=document.getElementById("sigR");
  function gate(){ const ok=name.value.trim().length>2 && agree.checked && sig.value.trim().toLowerCase()===name.value.trim().toLowerCase() && Number(rng.value)>0; btn.disabled=!ok; }
  [name,sig].forEach(x=>x.oninput=gate); agree.onchange=gate;
  sig.onblur=()=>{ sigR.textContent=sig.value.trim(); gate(); }; sig.oninput=()=>{ sigR.textContent=sig.value.trim(); gate(); };
  document.getElementById("openAgr").onclick=e=>{ e.preventDefault(); const s=document.createElement("div"); s.className="sheet"; s.innerHTML=`<div class="pane"><div class="row" style="justify-content:space-between"><h3>Credit Facility Agreement</h3><button class="btn sm" id="closeS">Close</button></div><p><b>1. Facility.</b> ${esc(S.workspace.name)} (“Lender”) makes available to ${esc(d.borrower)} (“Borrower”) a revolving credit facility of up to ${fmt(limit)}.</p><p><b>2. Interest.</b> ${f.apr.value}% per annum on drawn amounts, accruing daily, payable weekly by NACH mandate.</p><p><b>3. Term.</b> ${f.term.value} months from first draw; draws permitted for ${f.draw.value} months.</p><p><b>4. Conditions.</b> ${d.covenants.filter(c=>c.on).map(c=>c.borrower).join("; ")||"None"}. On breach, new draws pause.</p><p><b>5. Prepayment.</b> Permitted at any time without fee.</p><p><b>6. Electronic execution.</b> This agreement is executed electronically under the Information Technology Act, 2000.</p><p class="faint">Demo text — pages 2–14 omitted.</p></div>`; document.body.appendChild(s); s.onclick=e=>{ if(e.target===s||e.target.id==="closeS") s.remove(); }; };
  btn.onclick=async()=>{
    btn.disabled=true; btn.innerHTML=`<span class="spin" style="border-top-color:#fff;margin:0"></span> Signing…`;
    try{
      const r=await api("/api/offer/"+d.id+"/sign",{method:"POST",body:JSON.stringify({name:name.value.trim(),title:document.getElementById("sTitle").value.trim()||"Director",draw:Number(rng.value)})});
      Object.assign(d, r.deal); route();
    }catch(e){ toast("Could not sign: "+e.message); btn.disabled=false; btn.innerHTML="Accept and sign"; }
  };
  update(Number(rng.value));
}

load().then(route).catch(e=>{ document.getElementById("app").innerHTML=`<div class="wrap"><div class="card"><h1>Cannot reach the server</h1><p class="muted">${esc(e.message)}</p></div></div>`; });
</script>
